name: iPhone IPA Derleyici (Ücretsiz Sideloadly Paketi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-ipa:
    name: macOS Xcode -> OtoKurtarici.ipa
    runs-on: macos-latest

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Parçalı Xcode Arşivini Birleştir ve Çıkar
        run: |
          set -e
          if ls ios_xcode.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Parçalı arşiv birleştiriliyor..."
            cat ios_xcode.tar.gz.part* > ios_xcode.tar.gz
            tar -xzf ios_xcode.tar.gz
          fi

      - name: Xcode Projesi Klasörünü Bul ve Derle
        run: |
          set -e
          XCODE_PROJ=$(find . -name "Unity-iPhone.xcodeproj" | head -n 1)
          if [ -z "$XCODE_PROJ" ]; then
            echo "Unity-iPhone.xcodeproj bulunamadı!"
            exit 1
          fi
          XCODE_DIR=$(dirname "$XCODE_PROJ")
          echo "Bulunan Xcode dizini: $XCODE_DIR"
          cd "$XCODE_DIR"

          chmod -R +x . || true

          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" -type d | head -n 1)
          echo "Üretilen .app paketi: $APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa_stage/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa_stage/Payload/"
          cd "$RUNNER_TEMP/ipa_stage"
          zip -qry "$GITHUB_WORKSPACE/OtoKurtarici.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/OtoKurtarici.ipa"

      - name: OtoKurtarici.ipa Dosyasını İndirilebilir Paket Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: OtoKurtarici-iPhone-IPA
          path: OtoKurtarici.ipa
          retention-days: 30
